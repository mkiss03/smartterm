<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>MedSolution Launcher</title>
  <link rel="stylesheet" href="node_modules/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Dashboard View -->
  <div id="dashboard-view" class="view active">
    <div class="dashboard-container">
      <div class="header">
        <div class="logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="8" fill="#007ACC"/>
            <path d="M24 12L34 18V30L24 36L14 30V18L24 12Z" stroke="white" stroke-width="2" fill="none"/>
            <circle cx="24" cy="24" r="4" fill="white"/>
          </svg>
        </div>
        <h1>MedSolution Launcher</h1>
        <p class="subtitle">Secure SSH Terminal Client</p>
      </div>

      <div class="connect-section">
        <button id="connect-btn" class="connect-button">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 3C6.13 3 3 6.13 3 10s3.13 7 7 7 7-3.13 7-7-3.13-7-7-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
            <circle cx="10" cy="10" r="2"/>
          </svg>
          Connect to MedSolution
        </button>
      </div>

      <div class="status-section">
        <div class="status-header">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2a6 6 0 100 12A6 6 0 008 2zm0 11a5 5 0 110-10 5 5 0 010 10z"/>
            <circle cx="8" cy="8" r="2"/>
          </svg>
          <span>Connection Status</span>
        </div>
        <div id="status-log" class="status-log">
          <div class="status-message">Ready to connect...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Terminal View -->
  <div id="terminal-view" class="view">
    <div class="terminal-container">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="app-title">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
              <path d="M3 3h14a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V4a1 1 0 011-1zm1 2v10h12V5H4z"/>
              <path d="M6 7l3 2-3 2V7zm5 4h4v1h-4v-1z"/>
            </svg>
            <span>MedSolution Terminal</span>
          </div>
          <div class="connection-indicator">
            <span class="status-dot"></span>
            <span>Connected</span>
          </div>
        </div>
        <div class="toolbar-right">
          <button id="save-btn" class="toolbar-btn" title="Save (F2)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M13.5 1h-11C1.67 1 1 1.67 1 2.5v11c0 .83.67 1.5 1.5 1.5h11c.83 0 1.5-.67 1.5-1.5v-11c0-.83-.67-1.5-1.5-1.5zM4 2h6v4H4V2zm9 11.5a.5.5 0 01-.5.5h-9a.5.5 0 01-.5-.5v-9a.5.5 0 01.5-.5H3v4.5C3 8.78 3.22 9 3.5 9h7c.28 0 .5-.22.5-.5V2h1.5a.5.5 0 01.5.5v11z"/>
            </svg>
            <span>F2 Save</span>
          </button>
          <button id="exit-btn" class="toolbar-btn" title="Exit (F10)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 12.5a5.5 5.5 0 110-11 5.5 5.5 0 010 11zm2.5-7L9 8l1.5 1.5-1 1-1.5-1.5L6.5 10.5l-1-1L7 8 5.5 6.5l1-1L8 7l1.5-1.5 1 1z"/>
            </svg>
            <span>F10 Exit</span>
          </button>
          <button id="restart-btn" class="toolbar-btn" title="Restart Session">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3a5 5 0 104.546 2.914.5.5 0 01.908.417A6 6 0 118 2v1z"/>
              <path d="M8 1v4l2-2-2-2z"/>
            </svg>
            <span>Restart</span>
          </button>
        </div>
      </div>
      <div id="terminal" class="terminal-wrapper"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="node_modules/xterm/lib/xterm.js"></script>
  <script src="node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
